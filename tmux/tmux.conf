# ~/.tmux.conf
# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 100000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'
set -g detach-on-destroy off
set -g focus-events on
set -g set-clipboard on
set -g status-position top

# -----------------------------------------------------------------------------
# Prefix & Keybindings
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix

bind r source-file ~/.tmux.conf \; display "Reloaded .."

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------
set -g status-style "bg=colour235,fg=colour248"
set -g message-style "bg=colour235,fg=colour166"
set -g message-command-style "bg=colour235,fg=colour166"
setw -g clock-mode-colour colour117

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour154"
setw -g window-status-style "fg=colour244"
setw -g window-status-current-style "fg=colour166,bold"

#set -g status-left "#S | "
#set -g status-right "%H:%M %d-%b-%y"


set -g status-left ''
set -g status-right-length 150
set -g status-right "#[fg=grey]#(~/.tmuxDir/getProc.sh) #[fg=grey]| %H:%M %d-%b-%y "

set -g mode-style "fg=colour231,bg=colour33"

# -----------------------------------------------------------------------------
# Copy Mode
# -----------------------------------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi Escape send -X cancel
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send -X rectangle-toggle
bind C-c run "tmux save-buffer - | tmux load-buffer -w -"

#Copy current line instantly
bind-key -T copy-mode-vi Y send -X copy-line



# -----------------------------------------------------------------------------
# Windows & Panes
# -----------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-panes-time 2000
set -g display-panes-colour colour33
set -g display-panes-active-colour colour45
set -g mouse on

# -----------------------------------------------------------------------------
# Plugins (TPM)
# -----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

if "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"
